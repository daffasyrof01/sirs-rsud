services:
  postgres:
    image: postgres:16
    container_name: sirs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sirs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sirs"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
